[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-entanglement"
version = "0.1.0"
description = "Event-sourced multi-agent coordination kernel for human-agent group work"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "huapohen" }]
keywords = ["agents", "multi-agent", "a2a", "langgraph", "orchestration"]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=1.2.7,<2"]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.16.3", "mypy==2.3.1"]

[project.scripts]
qe-demo = "quantum_entanglement.cli:main"
qe-admin = "quantum_entanglement.admin_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_entanglement = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
