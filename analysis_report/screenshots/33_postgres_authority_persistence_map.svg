<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL authority persistence checkpoint map</title>
  <desc id="desc">Research evidence flows into migrations, authority schema, repositories and unit of work; PostgreSQL evidence verifies the current slice while six production gates remain.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1">
      <stop offset="0" stop-color="#114c79"/>
      <stop offset="1" stop-color="#176b78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d7df"/>
    </marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { fill: #f6fbff; font-size: 38px; font-weight: 750; }
      .subtitle { fill: #9eb8cc; font-size: 18px; }
      .section { fill: #dff8fb; font-size: 22px; font-weight: 700; }
      .card-title { fill: #ffffff; font-size: 19px; font-weight: 700; }
      .body { fill: #d6e4ee; font-size: 15px; }
      .small { fill: #9eb8cc; font-size: 13px; }
      .gate-title { fill: #fff1e8; font-size: 16px; font-weight: 700; }
      .gate-body { fill: #f4cdbd; font-size: 13px; }
      .tag { fill: #06131f; font-size: 14px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="280" fill="#16496c" opacity="0.17"/>
  <circle cx="120" cy="900" r="260" fill="#0d766d" opacity="0.12"/>

  <text x="70" y="70" class="title">W2 PostgreSQL Authority Persistence Checkpoint</text>
  <text x="70" y="104" class="subtitle">HEAD 8d662bf · PostgreSQL 18.6 · 4 migrations · 22 business tables · 19 atomic commits</text>

  <text x="70" y="158" class="section">一级调研证据</text>
  <g filter="url(#shadow)">
    <rect x="70" y="182" width="340" height="110" rx="16" fill="#162c47" stroke="#375875"/>
    <text x="92" y="215" class="card-title">Participant ≠ Authority</text>
    <text x="92" y="244" class="body">Clawith · CodexLoom · AgentSpace</text>
    <text x="92" y="268" class="small">membership / access / capability 必须分层</text>

    <rect x="70" y="310" width="340" height="110" rx="16" fill="#162c47" stroke="#375875"/>
    <text x="92" y="343" class="card-title">Chat ≠ Task / Acceptance</text>
    <text x="92" y="372" class="body">AgentTeams · Portfolio</text>
    <text x="92" y="396" class="small">Room、receipt、transport 不冒充业务完成</text>

    <rect x="70" y="438" width="340" height="110" rx="16" fill="#162c47" stroke="#375875"/>
    <text x="92" y="471" class="card-title">Tenant field ≠ Auth claim</text>
    <text x="92" y="500" class="body">A2A · Security Governance</text>
    <text x="92" y="524" class="small">human / Agent / workload / tenant / delegation 分层</text>

    <rect x="70" y="566" width="340" height="110" rx="16" fill="#162c47" stroke="#375875"/>
    <text x="92" y="599" class="card-title">Durable ≠ Live Projection</text>
    <text x="92" y="628" class="body">DeepSeek Harness</text>
    <text x="92" y="652" class="small">execution-side enforcement + durable event spine</text>
  </g>

  <path d="M 430 430 C 468 430 474 430 510 430" fill="none" stroke="#63d7df" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="520" y="158" class="section">已实现的持久化安全切片</text>
  <g filter="url(#shadow)">
    <rect x="510" y="182" width="550" height="494" rx="22" fill="url(#core)" stroke="#55c7ce" stroke-width="2"/>

    <rect x="540" y="214" width="490" height="104" rx="14" fill="#092c48" opacity="0.95"/>
    <text x="565" y="247" class="card-title">Fail-closed Migration Runner</text>
    <text x="565" y="276" class="body">PG18 · checksum ledger · advisory lock · cumulative postconditions</text>
    <text x="565" y="300" class="small">fixed search_path · bounded cleanup · data-executing DDL rejection</text>

    <rect x="540" y="336" width="490" height="128" rx="14" fill="#092c48" opacity="0.95"/>
    <text x="565" y="369" class="card-title">0001–0004 Authority Schema</text>
    <text x="565" y="398" class="body">roots · identity · ordinary conversation · membership/access</text>
    <text x="565" y="422" class="small">22 tables · 17 FORCE RLS tables · head/snapshot · deferred FK</text>
    <text x="565" y="446" class="small">agent_thread / message / Task / Artifact 明确未持久化</text>

    <rect x="540" y="482" width="490" height="164" rx="14" fill="#092c48" opacity="0.95"/>
    <text x="565" y="515" class="card-title">Tenant Repository + Serializable UoW</text>
    <text x="565" y="544" class="body">explicit tenant predicates · 0→1 / N→N+1 CAS</text>
    <text x="565" y="568" class="small">poison ignored failures · callback lifetime · tx-bound receipt</text>
    <text x="565" y="592" class="small">exact replay · request digest conflict · unknown commit readback</text>
    <text x="565" y="616" class="small">lock release before pool handoff（d588695）</text>
  </g>

  <path d="M 1080 430 C 1118 430 1124 430 1160 430" fill="none" stroke="#63d7df" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="1170" y="158" class="section">真实 PG18.6 证据</text>
  <g filter="url(#shadow)">
    <rect x="1160" y="182" width="370" height="110" rx="16" fill="#133d3f" stroke="#42b9a9"/>
    <text x="1185" y="215" class="card-title">Atomicity &amp; Isolation</text>
    <text x="1185" y="244" class="body">失败零部分写 · RLS wrong/unset fail closed</text>
    <text x="1185" y="268" class="small">runtime fixture：snapshot/receipt 历史不可改</text>

    <rect x="1160" y="310" width="370" height="110" rx="16" fill="#133d3f" stroke="#42b9a9"/>
    <text x="1185" y="343" class="card-title">Concurrency</text>
    <text x="1185" y="372" class="body">64 路 exact retry：callback 1 次</text>
    <text x="1185" y="396" class="small">64 路相同 CAS：1 个成功者</text>

    <rect x="1160" y="438" width="370" height="110" rx="16" fill="#133d3f" stroke="#42b9a9"/>
    <text x="1185" y="471" class="card-title">Failure Recovery</text>
    <text x="1185" y="500" class="body">synthetic commit ACK loss → new-connection resolve</text>
    <text x="1185" y="524" class="small">definite rollback ≠ unknown commit</text>

    <rect x="1160" y="566" width="370" height="110" rx="16" fill="#133d3f" stroke="#42b9a9"/>
    <text x="1185" y="599" class="card-title">Schema Integrity</text>
    <text x="1185" y="628" class="body">恶意新 migration 削弱旧 RLS → 全部回滚</text>
    <text x="1185" y="652" class="small">schema digests 只保护登记结构，不保护业务行</text>
  </g>

  <line x1="70" x2="1530" y1="724" y2="724" stroke="#f28362" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="70" y="700" width="340" height="48" rx="24" fill="#7d2e25"/>
  <text x="98" y="731" fill="#fff2ea" font-size="17" font-weight="750">当前边界：不是 production IM</text>

  <text x="70" y="790" class="section">接真实 IM 前仍需关闭的 P0</text>
  <g filter="url(#shadow)">
    <rect x="70" y="814" width="230" height="112" rx="15" fill="#4d2927" stroke="#a95845"/>
    <text x="88" y="845" class="gate-title">1 · Function-only Writes</text>
    <text x="88" y="872" class="gate-body">SECURITY DEFINER CAS</text>
    <text x="88" y="894" class="gate-body">exact roles / ACL manifest</text>

    <rect x="316" y="814" width="230" height="112" rx="15" fill="#4d2927" stroke="#a95845"/>
    <text x="334" y="845" class="gate-title">2 · Trusted Tenant</text>
    <text x="334" y="872" class="gate-body">Clerk verified claim</text>
    <text x="334" y="894" class="gate-body">claim/path/membership bind</text>

    <rect x="562" y="814" width="230" height="112" rx="15" fill="#4d2927" stroke="#a95845"/>
    <text x="580" y="845" class="gate-title">3 · Active Resolver</text>
    <text x="580" y="872" class="gate-body">actor + conversation + member</text>
    <text x="580" y="894" class="gate-body">permission + mandate + capability</text>

    <rect x="808" y="814" width="230" height="112" rx="15" fill="#4d2927" stroke="#a95845"/>
    <text x="826" y="845" class="gate-title">4 · Service Startup</text>
    <text x="826" y="872" class="gate-body">migrator + role check</text>
    <text x="826" y="894" class="gate-body">readiness + DB composition</text>

    <rect x="1054" y="814" width="230" height="112" rx="15" fill="#4d2927" stroke="#a95845"/>
    <text x="1072" y="845" class="gate-title">5 · Recovery Drills</text>
    <text x="1072" y="872" class="gate-body">dump/restore · restart · kill-9</text>
    <text x="1072" y="894" class="gate-body">old binary / future schema</text>

    <rect x="1300" y="814" width="230" height="112" rx="15" fill="#4d2927" stroke="#a95845"/>
    <text x="1318" y="845" class="gate-title">6 · Event / Outbox</text>
    <text x="1318" y="872" class="gate-body">durable stream + checkpoint</text>
    <text x="1318" y="894" class="gate-body">backfill/live + reconcile</text>
  </g>

  <g transform="translate(70,962)">
    <rect x="0" y="-20" width="35" height="25" rx="6" fill="#63d7df"/><text x="10" y="-2" class="tag">F</text>
    <text x="45" y="-2" class="small">verified fact</text>
    <rect x="178" y="-20" width="35" height="25" rx="6" fill="#b7c7d5"/><text x="188" y="-2" class="tag">C</text>
    <text x="223" y="-2" class="small">bounded claim</text>
    <rect x="356" y="-20" width="35" height="25" rx="6" fill="#e5b85c"/><text x="366" y="-2" class="tag">A</text>
    <text x="401" y="-2" class="small">analysis</text>
    <rect x="510" y="-20" width="35" height="25" rx="6" fill="#f28362"/><text x="520" y="-2" class="tag">U</text>
    <text x="555" y="-2" class="small">unverified / unfinished</text>
    <text x="1110" y="-2" class="small">Git canonical · Notion verified mirror</text>
  </g>
</svg>
