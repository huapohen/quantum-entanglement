name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            lockfile: requirements/dev-py39.lock
          - python-version: "3.12"
            lockfile: requirements/dev-py312.lock

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Reject obsolete workspace paths
        run: python scripts/check_workspace_paths.py

      - name: Verify dependency locks
        run: python scripts/verify_dependency_locks.py --repository-root .

      - name: Install locked development toolchain
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary :all: \
            -r "${{ matrix.lockfile }}"

      - name: Install package without dependency resolution
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-build-isolation \
            --no-deps \
            .

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile package
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic demo
        run: python examples/group_chat_demo.py

      - name: Smoke-test installed command
        run: qe-demo --compact

  release-evidence:
    name: Canonical release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up evidence Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release-py312.lock

      - name: Verify dependency locks
        run: python scripts/verify_dependency_locks.py --repository-root .

      - name: Install locked release toolchain
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary :all: \
            -r requirements/release-py312.lock

      - name: Install package without dependency resolution
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-build-isolation \
            --no-deps \
            .

      - name: Generate canonical release evidence
        env:
          QE_RELEASE_EVIDENCE_PATH: ${{ runner.temp }}/quantum-entanglement-release-evidence.json
        run: |
          python scripts/generate_release_evidence.py \
            > "$QE_RELEASE_EVIDENCE_PATH"

      - name: Verify evidence against checked-out source
        env:
          QE_EXPECTED_COMMIT: ${{ github.sha }}
          QE_RELEASE_EVIDENCE_PATH: ${{ runner.temp }}/quantum-entanglement-release-evidence.json
        run: |
          python scripts/verify_release_evidence.py \
            "$QE_RELEASE_EVIDENCE_PATH" \
            --repository-root . \
            --expected-commit "$QE_EXPECTED_COMMIT"

      - name: Retain release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quantum-entanglement-release-evidence.json
          if-no-files-found: error
          retention-days: 14
