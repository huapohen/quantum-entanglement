name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile package
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic demo
        run: python examples/group_chat_demo.py

      - name: Smoke-test installed command
        run: qe-demo --compact

  release-evidence:
    name: Canonical release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up evidence Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install evidence toolchain
        run: python -m pip install '.[dev]'

      - name: Generate canonical release evidence
        env:
          QE_RELEASE_EVIDENCE_PATH: ${{ runner.temp }}/quantum-entanglement-release-evidence.json
        run: |
          python scripts/generate_release_evidence.py \
            > "$QE_RELEASE_EVIDENCE_PATH"

      - name: Verify evidence against checked-out source
        env:
          QE_EXPECTED_COMMIT: ${{ github.sha }}
          QE_RELEASE_EVIDENCE_PATH: ${{ runner.temp }}/quantum-entanglement-release-evidence.json
        run: |
          python scripts/verify_release_evidence.py \
            "$QE_RELEASE_EVIDENCE_PATH" \
            --repository-root . \
            --expected-commit "$QE_EXPECTED_COMMIT"

      - name: Retain release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: local-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quantum-entanglement-release-evidence.json
          if-no-files-found: error
          retention-days: 14
