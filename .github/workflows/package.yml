name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/build-py312.lock

      - name: Verify dependency locks
        run: python scripts/verify_dependency_locks.py --repository-root .

      - name: Install locked build toolchain
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary :all: \
            -r requirements/build-py312.lock

      - name: Bind build timestamps to source commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Canonicalize source distribution
        run: python scripts/normalize_sdist.py --distribution-directory dist

      - name: Rebuild from an independent source checkout
        env:
          QE_EXPECTED_COMMIT: ${{ github.sha }}
          QE_REBUILD_DIRECTORY: ${{ runner.temp }}/quantum-entanglement-rebuild-dist
          QE_REBUILD_SOURCE: ${{ runner.temp }}/quantum-entanglement-rebuild-source
        run: |
          git worktree add --detach "$QE_REBUILD_SOURCE" "$QE_EXPECTED_COMMIT"
          python -m build \
            --no-isolation \
            --outdir "$QE_REBUILD_DIRECTORY" \
            "$QE_REBUILD_SOURCE"
          python scripts/normalize_sdist.py \
            --distribution-directory "$QE_REBUILD_DIRECTORY"

      - name: Verify byte-reproducible distributions
        env:
          QE_REBUILD_DIRECTORY: ${{ runner.temp }}/quantum-entanglement-rebuild-dist
        run: |
          python scripts/verify_reproducible_distributions.py \
            --reference-directory dist \
            --candidate-directory "$QE_REBUILD_DIRECTORY"

      - name: Generate source-bound distribution manifest
        env:
          QE_DISTRIBUTION_MANIFEST_PATH: ${{ runner.temp }}/quantum-entanglement-distribution-manifest.json
        run: |
          python scripts/distribution_manifest.py generate \
            --repository-root . \
            --distribution-directory dist \
            > "$QE_DISTRIBUTION_MANIFEST_PATH"

      - name: Verify distribution manifest and archives
        env:
          QE_DISTRIBUTION_MANIFEST_PATH: ${{ runner.temp }}/quantum-entanglement-distribution-manifest.json
          QE_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python scripts/distribution_manifest.py verify \
            "$QE_DISTRIBUTION_MANIFEST_PATH" \
            --repository-root . \
            --distribution-directory dist \
            --expected-commit "$QE_EXPECTED_COMMIT"

      - name: Verify durable migration package data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          expected = {
              "quantum_entanglement/attempts.py",
              "quantum_entanglement/migrations/0001_invocation_attempts.up.sql",
              "quantum_entanglement/migrations/0001_invocation_attempts.down.sql",
          }
          with ZipFile(wheels[0]) as archive:
              missing = expected.difference(archive.namelist())
          if missing:
              raise SystemExit(f"wheel is missing package data: {sorted(missing)}")
          PY

      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/qe-wheel-smoke
          /tmp/qe-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/qe-wheel-smoke/bin/python -m pip check
          /tmp/qe-wheel-smoke/bin/qe-demo --compact

      - name: Retain distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quantum-entanglement-distributions
          path: |
            dist/*
            ${{ runner.temp }}/quantum-entanglement-distribution-manifest.json
          if-no-files-found: error
          retention-days: 14
